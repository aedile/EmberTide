## IDF Component Manager manifest for fq_hal
## Phase 16: LittleFS VFS is required for hal_flash.c real implementation.
## esp_vfs_littlefs was removed from ESP-IDF built-in components in v5.x
## and must be fetched from the ESP-IDF Component Registry.
##
## Phase 23: Pinned to ^1.14 for stability.
## Wildcard "*" caused build failures when the registry updated to 1.15
## which introduced a breaking API change in esp_vfs_littlefs_conf_t.
dependencies:
  joltwallet/littlefs: "^1.14"
